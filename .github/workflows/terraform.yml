name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TF_IN_AUTOMATION: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/terraform-ec2-streamlit" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: >-
          terraform plan
          -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}"
          -var="ami_id=${{ vars.AMI_ID }}"
          -var="key_name=${{ vars.EC2_KEY_NAME }}"
          -var="project_name=${{ vars.PROJECT_NAME || 'terraform-ec2' }}"
          -var="allowed_ssh_cidr=${{ vars.ALLOWED_SSH_CIDR || '0.0.0.0/0' }}"
          -var="docker_image=${{ env.IMAGE_NAME }}:${{ github.sha }}"
          -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
