name: Manual Terraform Destroy

# Manual-only workflow. It does not run on push or pull_request.
# Enter the successful Apply workflow run ID whose state should be destroyed.
on:
  workflow_dispatch:
    inputs:
      apply_run_id:
        description: "Successful Apply workflow run ID containing terraform-state"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Restore the exact local state uploaded by the selected Apply run.
      - name: Download Terraform state
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: .
          run-id: ${{ inputs.apply_run_id }}
          github-token: ${{ github.token }}

      - name: Verify Terraform state
        shell: bash
        run: |
          if [[ ! -s terraform.tfstate ]]; then
            echo "::error::Terraform state was not found or is empty. Destroy stopped safely."
            exit 1
          fi

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy
        run: terraform destroy -auto-approve -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}"
