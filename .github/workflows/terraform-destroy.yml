name: Manual Terraform Destroy

# This workflow is intentionally manual-only.
# It never runs on push or pull_request and deletes resources tracked in the
# same S3 state used by the deployment workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init with shared state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          if [[ -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::GitHub Actions variable TF_STATE_BUCKET is missing."
            exit 1
          fi
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=terraform-ec2/terraform.tfstate" \
            -backend-config="region=$AWS_REGION_VALUE" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform destroy
        env:
          AWS_REGION_VALUE: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: terraform destroy -auto-approve -var="aws_region=$AWS_REGION_VALUE"
